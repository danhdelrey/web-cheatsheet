<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Không tìm thấy trang</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="assets/site.js"></script>
<style>
:root{--bg:#f4f5f8;--fg:#171a22;--muted:#596173;--line:#dce0e8;--surface:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--fg:#e6e8ee;--muted:#9ba1b2;--line:#2a2f3b;--surface:#161922;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--fg:#e6e8ee;--muted:#9ba1b2;--line:#2a2f3b;--surface:#161922;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
code{font:600 48px/1 ui-monospace,Consolas,monospace;letter-spacing:-.04em}
p{color:var(--muted);margin:12px 0 24px}
a{display:inline-block;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:inherit;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <code>404</code>
  <p>Trang này không tồn tại hoặc đã đổi đường dẫn.</p>
  <a id="home" href="/">← Về trang chủ cheatsheet</a>
</main>
<script>
/* Trên GitHub Pages dạng username.github.io/<repo>/, trang chủ nằm ở /<repo>/ chứ không phải / */
(function () {
  var seg = location.pathname.split('/').filter(Boolean);
  if (!seg.length) return;
  var guess = '/' + seg[0] + '/';
  fetch(guess + 'assets/site.js', { method: 'HEAD' }).then(function (r) {
    if (r.ok) document.getElementById('home').href = guess;
  }).catch(function () {});
})();
</script>
</body>
</html>
